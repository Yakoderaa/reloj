name: Research V1.24 CEDevData Wire
on:
  push:
    branches: [research-v123-valid-market]
    paths: ['.github/workflows/research-v124-wire.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download UtraWatch package
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://d.apkpure.net/b/XAPK/com.wtwd.utrawatch?version=latest'
          curl -L --fail --retry 3 --connect-timeout 20 "$URL" -o UtraWatch.zip
          mkdir xapk
          unzip -q UtraWatch.zip -d xapk
      - name: Install JADX
        shell: bash
        run: |
          curl -L --fail --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
      - name: Decompile and extract wire classes
        shell: bash
        run: |
          set -euxo pipefail
          APK=$(find xapk -type f -name '*.apk' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)
          mkdir decompiled evidence
          jadx/bin/jadx -d decompiled "$APK" || true
          find decompiled -type f | head -200 > evidence/tree-head.txt || true
          grep -R -n -E 'sendWatchFileData|setItemNumber|setItemL|class CEDevData|DATA_TYPE_WATCH_FACE_SYNC|FileTransControl|startFileTrans|870558583' decompiled > evidence/grep.txt || true
          cut -d: -f1 evidence/grep.txt | sort -u | head -100 > evidence/files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            cp "$f" "evidence/$(echo "$f" | sed 's#^decompiled/##;s#/#__#g')" || true
          done < evidence/files.txt
          sed -n '1,1600p' evidence/grep.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v124-wire-evidence
          path: evidence
