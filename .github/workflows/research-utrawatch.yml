name: Research UtraWatch V1.20 Market
on:
  push:
    branches: [research-v120-market]
    paths:
      - '.github/workflows/research-utrawatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Query UtraWatch market for device 1180
        shell: bash
        run: |
          set -u
          mkdir -p evidence
          for page in 0 1 2 3 4 5; do
            curl -L -sS --max-time 20 "http://watchhealth.com.cn/YueDongService/app/faces.do?deviceId=1180&pageIndex=$page" -o "evidence/faces-1180-p$page.json" || true
          done
          curl -L -sS --max-time 20 "http://watchhealth.com.cn/YueDongService/app/faceConfig.do?deviceId=1180&pageIndex=1" -o evidence/faceConfig-1180-p1.json || true
          : > evidence/market-urls.txt
          for j in evidence/faces-1180-p*.json; do
            jq -r '.. | objects | to_entries[]? | select(.value|type=="string") | select(.value|startswith("http://") or startswith("https://")) | [.key,.value] | @tsv' "$j" >> evidence/market-urls.txt 2>/dev/null || true
          done
          sort -u evidence/market-urls.txt -o evidence/market-urls.txt
          cat evidence/faceConfig-1180-p1.json > evidence/summary.txt 2>/dev/null || true
          for j in evidence/faces-1180-p*.json; do
            echo "=== $j ===" >> evidence/summary.txt
            cat "$j" >> evidence/summary.txt
            echo >> evidence/summary.txt
          done
          n=0
          while IFS=$'\t' read -r key url; do
            case "$key $url" in
              *file*|*File*|*.bin*)
                [ "$n" -ge 16 ] && break
                dest=$(printf 'evidence/market-%02d.bin' "$n")
                curl -L -sS --fail --max-time 30 "$url" -o "$dest" || rm -f "$dest"
                if [ -f "$dest" ]; then
                  echo "$dest $(wc -c < "$dest") $url" >> evidence/downloaded.txt
                  n=$((n+1))
                fi
                ;;
            esac
          done < evidence/market-urls.txt
          : > evidence/market-analysis.txt
          for f in evidence/market-*.bin; do
            [ -f "$f" ] || continue
            echo "=== $f ===" >> evidence/market-analysis.txt
            file "$f" >> evidence/market-analysis.txt || true
            wc -c "$f" >> evidence/market-analysis.txt || true
            sha256sum "$f" >> evidence/market-analysis.txt || true
            xxd -l 512 "$f" >> evidence/market-analysis.txt || true
            strings -a -n 4 "$f" | head -120 >> evidence/market-analysis.txt || true
          done
          find evidence -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: utrawatch-v120-market-evidence
          path: evidence
          if-no-files-found: error
