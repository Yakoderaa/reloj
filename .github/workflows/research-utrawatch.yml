name: Research UtraWatch Dial Transfer
on:
  push:
    branches: [main, research-v081-face-slot]
    paths:
      - '.github/workflows/research-utrawatch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download UtraWatch package
        shell: bash
        run: |
          set -euxo pipefail
          URL='https://04.apk.dog/storage/22/088/475/1088475/split/379294/UtraWatch.zip?apk_id=1232604&e=1790631237&file_id=3328642&lang=en&premium_speed=0&s=iCEtpd6BvpskuNvN9_qRsA&split_id=379294'
          curl -L --fail --retry 3 --connect-timeout 20 "$URL" -o UtraWatch.zip
          ls -lh UtraWatch.zip
          unzip -l UtraWatch.zip | head -80
          mkdir xapk
          unzip -q UtraWatch.zip -d xapk
          find xapk -maxdepth 2 -type f -printf '%p %s bytes\n' | head -80
      - name: Install JADX
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --fail --retry 3 https://github.com/skylot/jadx/releases/download/v1.5.3/jadx-1.5.3.zip -o jadx.zip
          unzip -q jadx.zip -d jadx
          chmod +x jadx/bin/jadx
          jadx/bin/jadx --version
      - name: Decompile base APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=$(find xapk -type f -name '*.apk' | sort | head -1)
          echo "APK=$APK"
          mkdir decompiled
          jadx/bin/jadx -d decompiled "$APK" || true
      - name: Extract dial transfer evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir evidence
          PAT='DIAL_COMPRESS_CTRL|IS_START_BIG_SEND|DATA_TYPE_DIAL_SYNC|DATA_TYPE_DIAL_INFO|FUNCTION_CONTROL|添加大发送数据|大发送|DialInfo|DialSync|dialSync|bigSend|BigSend|GZipUtils|ANSWER_OVER|CUSTOMIZE|FileTransControl|sendFile|sendWatchFileData|getFileDownloadInfo|K6_DATA_TYPE_WATCH_FACE_INFO|WATCH_FACE_INFO|fileDataSendResult|fileStateResult|V2BleFileDownLoadActivity|startFileDownload|jSONObject.put|K6_DATA_TYPE_WATCH_FACE_SYN_NNNOMAL_CHOICE|FACE_SYN_NNNOMAL_CHOICE|ChoiceClockdialAdapter|Clockdial|faceConfig|V2HttpInterface|V2HttpHelper|K6_DevInfoStruct|ProcessDATA_TYPE_NEW_PID|DATA_TYPE_NEW_PID|setPid|getPid|showOrder|FaceConfigBean|app-halfwit|watchhealth'
          grep -R -n -E "$PAT" decompiled > evidence/grep.txt || true
          echo '=== MATCH COUNT ==='
          wc -l evidence/grep.txt
          echo '=== FIRST 500 MATCHES ==='
          sed -n '1,500p' evidence/grep.txt
          cut -d: -f1 evidence/grep.txt | sort -u | head -120 > evidence/files.txt || true
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            safe=$(echo "$f" | sed 's#^decompiled/##; s#/#__#g')
            cp "$f" "evidence/$safe" || true
          done < evidence/files.txt
          for pid in 10 11 50 100 101 102 103 104 105 255 8330 35360; do
            for page in 0 1; do
              curl -L -sS --max-time 15 "http://watchhealth.com.cn/YueDongService/app/faceConfig.do?deviceId=$pid&pageIndex=$page" -o "evidence/faceConfig-$pid-p$page-http.json" || true
            done
          done
          for f in evidence/faceConfig-*.json; do echo "=== $f ==="; cat "$f" || true; echo; done
          echo '=== V2BleFileDownLoadVM full ==='
          sed -n '1,360p' decompiled/sources/com/utra/vm/V2BleFileDownLoadVM.java || true
          echo '=== V2BleFileDownLoadActivity full ==='
          sed -n '1,340p' decompiled/sources/com/utra/ui/module/device/watch/more/V2BleFileDownLoadActivity.java || true
          echo '=== V2ChoiceClockdialVM choice/download ==='
          sed -n '1,220p' decompiled/sources/com/utra/ui/module/device/watch/V2ChoiceClockdialVM.java || true
          echo '=== V2ChoiceClockdialVM 220-430 ==='
          sed -n '220,430p' decompiled/sources/com/utra/ui/module/device/watch/V2ChoiceClockdialVM.java || true
          echo '=== FileTransControl full ==='
          sed -n '1,240p' decompiled/sources/com/wr/sdk/fileTransmission/FileTransControl.java || true
          echo '=== SendDataManager watchface methods ==='
          grep -n -A35 -B20 -E 'sendWatchFileData|getFileDownloadInfo|WATCH_FACE|DIAL_SYNC' decompiled/sources/com/wr/sdk/proxy/data/send/SendDataManager.java || true
          mkdir -p evidence/donors
          python - <<'PY'
import json, urllib.request
wanted={"2011017","2011092","2029002"}
found={}
for page in range(1,10):
    u=f"https://wr.watchhealth.com.cn/app-halfwit/app-dial/getDialList?currentPage={page}&pageSize=20&watchId=102"
    with urllib.request.urlopen(u,timeout=20) as r:
        obj=json.load(r)
    for e in obj.get("data") or []:
        did=str(e.get("dialId") or "")
        if did in wanted:
            found[did]=e
    if len(found)==len(wanted): break
for did,e in found.items():
    for kind,key,ext in [("file","dialFile","bin"),("preview","previewImg","png")]:
        url=e.get(key)
        if url:
            out=f"evidence/donors/{did}-{kind}.{ext}"
            urllib.request.urlretrieve(url,out)
            print(did,kind,url,out)
with open("evidence/donors/meta.json","w") as f: json.dump(found,f,indent=2)
PY
          sha256sum evidence/donors/* || true
          xxd -g1 -l 96 evidence/donors/2011017-file.bin || true
          xxd -g1 -l 96 evidence/donors/2029002-file.bin || true
          xxd -g1 -l 96 evidence/donors/2011092-file.bin || true
          find evidence -maxdepth 1 -type f -printf '%f\n' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: utrawatch-dial-evidence
          path: evidence
          if-no-files-found: error
