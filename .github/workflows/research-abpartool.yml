name: Research UI Transfer
on:
  push:
    branches: [research-abpartool]
permissions:
  contents: read
jobs:
  research:
    runs-on: windows-latest
    steps:
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Inspect watch UI transfer SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path out | Out-Null
          $vp = "https://raw.githubusercontent.com/HBandSDK/Android_Ble_SDK/add57a049a916c210c5463a66b097ad94265e481/android_sdk_source/jar_core/vpprotocol-2.3.85.15.aar"
          Invoke-WebRequest -Uri $vp -OutFile vp.aar
          Copy-Item vp.aar vp.zip
          Expand-Archive vp.zip -DestinationPath vpdir
          jar tf vpdir/classes.jar | Out-File -Encoding utf8 out/classes.txt
          $targets = Get-Content out/classes.txt | Where-Object { $_ -match "(UiUpdate|UIBase|BigTran|BigData|WatchUI|UiBase|UIFromType|Dial)" -and $_ -like "*.class" } | ForEach-Object { $_.Replace("/",".").Replace(".class","") }
          $targets | Out-File -Encoding utf8 out/targets.txt
          foreach ($c in $targets) {
            "===== $c =====" | Out-File -Append -Encoding utf8 out/javap.txt
            javap -classpath vpdir/classes.jar -p -c -s $c 2>&1 | Out-File -Append -Encoding utf8 out/javap.txt
          }
      - uses: actions/upload-artifact@v4
        with:
          name: ui-transfer-research
          path: out
