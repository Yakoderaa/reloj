name: Research UtraWatch Legacy WF V1.20
on:
  push:
    branches: [research-v120-market]
    paths:
      - '.github/workflows/research-legacy-v120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and classify legacy WF faces
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p evidence/previews evidence/bins
          cat > /tmp/research.py <<'PY'
import json, urllib.request, pathlib, hashlib, csv, time
base='https://wr.watchhealth.com.cn/app-halfwit/app-dial/getDialList'
H={'User-Agent':'RelojLab/1.20-research','Accept':'application/json'}
rows=[]
for page in range(1,26):
    url=f'{base}?currentPage={page}&pageSize=20&watchId=102'
    req=urllib.request.Request(url,headers=H)
    try:
        with urllib.request.urlopen(req,timeout=25) as r:
            obj=json.loads(r.read().decode('utf-8','replace'))
    except Exception as e:
        print('PAGE_FAIL',page,repr(e)); continue
    data=obj.get('data') if isinstance(obj,dict) else None
    if not data: break
    rows.extend(x for x in data if isinstance(x,dict))
print('ROWS',len(rows))
pathlib.Path('evidence/catalog.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')

def get(url,dest):
    req=urllib.request.Request(url,headers={'User-Agent':'RelojLab/1.20-research','Accept':'*/*'})
    with urllib.request.urlopen(req,timeout=30) as r:
        data=r.read(5*1024*1024)
    pathlib.Path(dest).write_bytes(data); return data

def u16(b,o): return int.from_bytes(b[o:o+2],'little')
def u32(b,o): return int.from_bytes(b[o:o+4],'little')
out=[]
for i,e in enumerate(rows):
    did=str(e.get('dialId') or '')
    file=e.get('dialFile')
    preview=e.get('preview') or e.get('dialPreview') or e.get('previewUrl') or e.get('imgUrl')
    rec={'i':i,'dialId':did,'file':file,'preview':preview}
    if isinstance(preview,str) and preview.startswith('http'):
        try:get(preview,f'evidence/previews/{did}.png')
        except Exception as ex:rec['preview_error']=repr(ex)
    if isinstance(file,str) and file.startswith('http'):
        try:
            b=get(file,f'evidence/bins/{did}.bin')
            rec['size']=len(b);rec['sha256']=hashlib.sha256(b).hexdigest()
            if len(b)>=54 and b[:2]==b'WF':
                n=u16(b,0x2e);rec['wf']=True;rec['version']=u16(b,2);rec['width']=u16(b,0x2a);rec['height']=u16(b,0x2c)
                types=[]
                descs=[]
                for j in range(n):
                    off=54+j*20
                    if off+20>len(b):break
                    raw=b[off:off+20]
                    typ=u16(raw,2);types.append(f'0x{typ:04X}')
                    descs.append({'i':j,'type':f'0x{typ:04X}','frames':u16(raw,4),'x':u16(raw,6),'y':u16(raw,8),'ptr':u16(raw,18)})
                rec['types']=types;rec['descriptors']=descs
        except Exception as ex:rec['file_error']=repr(ex)
    out.append(rec)
pathlib.Path('evidence/index.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
freq={}
for r in out:
    for t in set(r.get('types') or []):freq[t]=freq.get(t,0)+1
pathlib.Path('evidence/type_frequency.json').write_text(json.dumps(sorted(freq.items(),key=lambda x:(-x[1],x[0])),indent=2),encoding='utf-8')
for r in out:
    ts=set(r.get('types') or [])
    if {'0x0501','0x0601','0x0701'}.issubset(ts):
        print('ANALOG',r['dialId'],r.get('size'),','.join(r.get('types') or []))
PY
          python /tmp/research.py
          find evidence -maxdepth 2 -type f -printf '%P %s bytes\n' | head -200
      - uses: actions/upload-artifact@v4
        with:
          name: utrawatch-v120-legacy-wf
          path: evidence
          if-no-files-found: error
