name: Research UtraWatch Legacy WF V1.20
on:
  push:
    branches: [research-v120-market]
    paths:
      - '.github/workflows/research-legacy-v120.yml'
      - 'research_legacy_v120.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Classify legacy WF faces
        run: python research_legacy_v120.py
      - uses: actions/upload-artifact@v4
        with:
          name: utrawatch-v120-legacy-wf
          path: evidence
          if-no-files-found: error
