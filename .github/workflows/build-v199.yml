name: Build V1.99
on:
  push:
    branches: [main]
    paths:
      - 'app_v199.py'
      - 'app_v173.py'
      - '.github/workflows/build-v199.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0 pillow numpy
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest 'http://watchhealth.com.cn/k6File/clock/file/2D7F.bin' -OutFile assets/donor_2D7F.bin
      - run: python prepare_v133_dynamic.py
      - run: python -m unittest discover -s tests
      - run: python -m py_compile app_v173.py app_v199.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab --add-data "assets/face_v133_custom_same_id.b64;assets" --add-data "assets/face_v133_custom_verified.b64;assets" --add-data "assets/face_v133_oem_recovery.b64;assets" --add-data "assets/face_v133.json;assets" app_v173.py
      - name: SHA256
        id: sha
        shell: pwsh
        run: |
          $hash=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host $hash
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V1.99
          path: dist/RelojLab.exe
          if-no-files-found: error
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.99.0
          name: Reloj Lab V1.99
          body: V1.99 repairs the DEX method/code mapping and identifies the real activationDevice method. No firmware or OTA transfer.
          files: dist/RelojLab.exe
          make_latest: true
      - name: Update manifest
        shell: pwsh
        run: |
          $obj = [ordered]@{
            exe_url = 'https://github.com/Yakoderaa/reloj/releases/download/v1.99.0/RelojLab.exe'
            sha256 = '${{ steps.sha.outputs.sha256 }}'
            notes = 'V1.99 corrige el mapa DEX de activationDevice y mantiene Buscar ubicacion.'
            version = '1.99.0'
          }
          $obj | ConvertTo-Json | Set-Content version.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m 'Advance updater manifest to V1.99'; git push }
