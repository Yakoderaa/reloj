name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V2.19 wrapper
        run: python -c "import ast; s=open('app_v173.py',encoding='utf-8').read(); ast.parse(s); assert 'app_v219' in s; t=open('app_v219.py',encoding='utf-8').read(); ast.parse(t); assert '2.19.0' in t; assert 'GENERAR DIAGNÓSTICO NUEVO V2.18' in t"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0 pillow numpy
      - name: Prepare assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest 'http://watchhealth.com.cn/k6File/clock/file/2D7F.bin' -OutFile assets/donor_2D7F.bin
      - run: python prepare_v133_dynamic.py
      - run: python -m unittest discover -s tests
      - run: python -m py_compile app_v173.py app_v219.py app_v218.py app_v217.py app_v216.py app_v215.py app_v214.py app_v213.py app_v212.py app_v211.py app_v210.py app_v209.py app_v208.py app_v183.py app_v199.py app_v180.py app_v179.py app_v145.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab --add-data "assets/face_v133_custom_same_id.b64;assets" --add-data "assets/face_v133_custom_verified.b64;assets" --add-data "assets/face_v133_oem_recovery.b64;assets" --add-data "assets/face_v133.json;assets" app_v173.py
      - name: SHA256
        id: sha
        shell: pwsh
        run: |
          $hash=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host $hash
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V2.19
          path: dist/RelojLab.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.19.0
          name: Reloj Lab V2.19
          body: V2.19 clears stale clipboard diagnostics and forces a fresh V2.18 base-URL/token analysis. No firmware or OTA writes.
          files: dist/RelojLab.exe
          make_latest: true
      - name: Advance updater manifest
        shell: pwsh
        run: |
          $obj = [ordered]@{
            exe_url = 'https://github.com/Yakoderaa/reloj/releases/download/v2.19.0/RelojLab.exe'
            sha256 = '${{ steps.sha.outputs.sha256 }}'
            notes = 'V2.19 prevents stale diagnostics and forces a fresh base URL + token run.'
            version = '2.19.0'
          }
          $obj | ConvertTo-Json | Set-Content version.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m 'Advance updater manifest to V2.19'; git pull --rebase; git push }
