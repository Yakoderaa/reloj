name: Build Windows EXE
on:
  push:
    branches: [main, prepare-v0.22.0]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reloj-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Verify logic
        run: python -m unittest discover -s tests -v
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows
          path: dist/RelojLab.exe
          if-no-files-found: error
