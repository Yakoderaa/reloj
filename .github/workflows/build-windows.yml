name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reloj-release-main-v106
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify read-only inventory and cleanup
        run: python -m unittest discover -s tests -p test_inventory.py -v
      - run: python build_patch_v029.py
      - run: python build_patch_v075.py
      - run: python build_patch_v080.py
      - run: python build_patch_v081.py
      - run: python build_patch_v082.py
      - run: python build_patch_v083.py
      - run: python build_patch_v084.py
      - run: python build_patch_v085.py
      - run: python build_patch_v086.py
      - run: python build_patch_v087.py
      - run: python build_patch_v088.py
      - run: python build_patch_v101.py
      - run: python build_patch_v102.py
      - run: python build_patch_v103.py
      - run: python build_patch_v104.py
      - run: python build_patch_v105.py
      - run: python build_patch_v106.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Verify syntax
        run: python -m py_compile app.py
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows
          path: dist/RelojLab.exe
          if-no-files-found: error
      - name: Publish verified EXE then announce update
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = python -c "import ast; t=ast.parse(open('app.py',encoding='utf-8').read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))"
          $releaseTag = "v$releaseVersion"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) { throw "La versión ya existe" }
          gh release create $releaseTag dist/RelojLab.exe --target $env:GITHUB_SHA --title "Reloj Lab $releaseVersion" --notes "V1.06: no confunde B001/B002 cacheados con conexión física. Antes de entregar una sesión, exige una lectura ATT real del descriptor CCCD 0x2902 de B001; sólo entonces continúa a notify y protocolo OEM. Esfera aprobada intacta."
          if ($LASTEXITCODE -ne 0) { throw "Falló publicación" }
          New-Item -ItemType Directory -Path verified | Out-Null
          gh release download $releaseTag --pattern RelojLab.exe --dir verified
          $expectedHash=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          if ((Get-FileHash verified/RelojLab.exe -Algorithm SHA256).Hash.ToLower() -ne $expectedHash) { throw "SHA incorrecto" }
          $metadata=@{version=$releaseVersion;exe_url="https://github.com/Yakoderaa/reloj/releases/download/$releaseTag/RelojLab.exe";sha256=$expectedHash;notes="V1.06: physical-ready mediante lectura ATT real de B001 CCCD antes de notify; esfera aprobada intacta."}
          $metadata|ConvertTo-Json|Set-Content -Encoding utf8NoBOM version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Publish verified $releaseTag update metadata"
          git push origin HEAD:main
