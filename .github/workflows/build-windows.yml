name: Build Windows EXE
on:
  push:
    branches: [main, release-v084-target-market]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reloj-release-main-v084
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify read-only inventory and cleanup
        run: python -m unittest discover -s tests -p test_inventory.py -v
      - name: Apply v0.74 base patch
        run: python build_patch_v029.py
      - name: Apply v0.75 offline overlay
        run: python build_patch_v075.py
      - name: Apply v0.80 OEM face overlay
        run: python build_patch_v080.py
      - name: Apply v0.81 exact face selection overlay
        run: python build_patch_v081.py
      - name: Apply v0.82 OEM transfer state overlay
        run: python build_patch_v082.py
      - name: Apply v0.83 real CUSTOMIZE bin + CEProtocolB overlay
        run: python build_patch_v083.py
      - name: Apply v0.84 target-photo dynamic MARKET overlay
        run: python build_patch_v084.py
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Verify syntax
        run: python -m py_compile app.py
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows
          path: dist/RelojLab.exe
          if-no-files-found: error
      - name: Publish verified EXE then announce update
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseVersion = python -c "import ast; t=ast.parse(open('app.py',encoding='utf-8').read()); print(next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)))"
          $releaseTag = "v$releaseVersion"
          gh release view $releaseTag *> $null
          if ($LASTEXITCODE -eq 0) { throw "La versión ya existe; no se reemplazan ejecutables publicados." }
          gh release create $releaseTag dist/RelojLab.exe --target $env:GITHUB_SHA --title "Reloj Lab $releaseVersion" --notes "V0.84: reconstruye la esfera objetivo de la foto como WF MARKET dinámico 240x296 con analógico central, hora curvada arriba izquierda, pasos y pulso; conserva CEProtocolB corregido."
          if ($LASTEXITCODE -ne 0) { throw "Falló la publicación del EXE" }
          New-Item -ItemType Directory -Path verified | Out-Null
          gh release download $releaseTag --pattern RelojLab.exe --dir verified
          if ($LASTEXITCODE -ne 0) { throw "No se pudo verificar la descarga publicada" }
          $expectedHash = (Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          if ((Get-FileHash verified/RelojLab.exe -Algorithm SHA256).Hash.ToLower() -ne $expectedHash) { throw "SHA-256 publicado incorrecto" }
          $metadata = @{version=$releaseVersion; exe_url="https://github.com/Yakoderaa/reloj/releases/download/$releaseTag/RelojLab.exe"; sha256=$expectedHash; notes="V0.84: esfera dinámica basada en la foto objetivo, instalada en MARKET con analógico/hora/pasos/pulso; actualizaciones futuras desde Buscar actualización."}
          $metadata | ConvertTo-Json | Set-Content -Encoding utf8NoBOM version.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add version.json
          git commit -m "Publish verified $releaseTag update metadata"
          git push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw "EXE disponible pero actualización no anunciada" }
