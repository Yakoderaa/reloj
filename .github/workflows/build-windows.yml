name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_patch_v029.py
      - run: python build_patch_v075.py
      - run: python build_patch_v080.py
      - run: python build_patch_v081.py
      - run: python build_patch_v082.py
      - run: python build_patch_v083.py
      - run: python build_patch_v084.py
      - run: python build_patch_v085.py
      - run: python build_patch_v086.py
      - run: python build_patch_v087.py
      - run: python build_patch_v088.py
      - run: python build_patch_v101.py
      - run: python build_patch_v102.py
      - run: python build_patch_v103.py
      - run: python build_patch_v104.py
      - run: python build_patch_v105.py
      - run: python build_patch_v106.py
      - run: python build_patch_v107.py
      - run: python build_patch_v108.py
      - run: python build_patch_v109.py
      - run: python build_patch_v110.py
      - run: python build_patch_v111.py
      - name: Verify V1.11
        run: python -c "import ast; t=ast.parse(open('app.py',encoding='utf-8').read()); v=next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)); assert v=='1.11.0',v"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - run: python -m py_compile app.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V1.11
          path: dist/RelojLab.exe
          if-no-files-found: error
