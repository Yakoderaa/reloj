name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V1.28
        run: python -c "import ast; t=ast.parse(open('app.py',encoding='utf-8').read()); v=next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)); assert v=='1.28.0',v"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0 pillow numpy
      - name: Fetch physically proven 2D7F MARKET
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest 'http://watchhealth.com.cn/k6File/clock/file/2D7F.bin' -OutFile assets/donor_2D7F.bin
      - name: Build V1.28 minimal pixel-only patch
        run: python prepare_v128_minpatch.py
      - run: python -m unittest discover -s tests
      - run: python -m py_compile app.py connection.py windows_binding.py prepare_v128_minpatch.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab --add-data "assets/face_v128_minimal_patch.b64;assets" --add-data "assets/face_v128_oem_recovery.b64;assets" --add-data "assets/face_v128.json;assets" app.py
      - name: Calculate EXE SHA256 and updater manifest
        shell: pwsh
        run: |
          $sha=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          $manifest=@{
            version='1.28.0'
            exe_url='https://github.com/Yakoderaa/reloj/releases/download/v1.28.0/RelojLab.exe'
            sha256=$sha
            notes='V1.28: parche mínimo sobre la MARKET 2D7F que ya funciona en el reloj. Conserva byte por byte header, BinID, descriptores, tabla de recursos y recursos dinámicos; cambia únicamente el bitmap de fondo por el diseño negro Reloj Lab. Si cmd3 cae a 0000, restaura automáticamente la 2D7F OEM.'
          } | ConvertTo-Json
          Set-Content -Path version.json -Value $manifest -Encoding UTF8
      - name: Publish V1.28 release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.28.0 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v1.28.0 dist/RelojLab.exe --title 'Reloj Lab V1.28' --notes 'V1.28 deja intacta la estructura OEM 2D7F y reemplaza sólo el recurso de fondo. El éxito se valida porque WATCH_FACE_INFO debe conservar cmd3=2D7F; si el firmware lo rechaza y pasa a 0000, la app restaura la OEM automáticamente.' }
          else { gh release upload v1.28.0 dist/RelojLab.exe --clobber }
      - name: Publish updater manifest
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m 'Updater: publish V1.28' || echo 'manifest unchanged'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V1.28
          path: dist/RelojLab.exe
          if-no-files-found: error
