name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V1.22
        run: python -c "import ast; t=ast.parse(open('app.py',encoding='utf-8').read()); v=next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)); assert v=='1.22.0',v"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Fetch verified MARKET donors
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest 'http://watchhealth.com.cn/k6File/clock/file/4CC6.bin' -OutFile assets/donor_4CC6.bin
          Invoke-WebRequest 'http://watchhealth.com.cn/k6File/clock/file/04C2.bin' -OutFile assets/donor_04C2.bin
          Invoke-WebRequest 'http://watchhealth.com.cn/k6File/clock/file/2D7F.bin' -OutFile assets/donor_2D7F.bin
      - name: Build and validate V1.22 MARKET face
        run: python prepare_v121_dynamic.py
      - run: python -m unittest discover -s tests
      - run: python -m py_compile app.py connection.py windows_binding.py prepare_v121_dynamic.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab --add-data "assets/target_face_v121.b64;assets" --add-data "assets/target_face_v121.json;assets" app.py
      - name: Calculate EXE SHA256 and updater manifest
        shell: pwsh
        run: |
          $sha=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          $manifest=@{
            version='1.22.0'
            exe_url='https://github.com/Yakoderaa/reloj/releases/download/v1.22.0/RelojLab.exe'
            sha256=$sha
            notes='V1.22: corrige el fallo de inicialización de V1.21 y conserva la instalación MARKET real por cmd=3 con verificación de BinID 4CC6 antes de seleccionar la esfera.'
          } | ConvertTo-Json
          Set-Content -Path version.json -Value $manifest -Encoding UTF8
      - name: Publish V1.22 release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.22.0 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v1.22.0 dist/RelojLab.exe --title 'Reloj Lab V1.22' --notes 'V1.22 corrige el UnboundLocalError de V1.21: el BinID se carga antes de mostrarse. Mantiene transferencia MARKET real cmd=3, verificación de registro y selección del slot MARKET.' }
          else { gh release upload v1.22.0 dist/RelojLab.exe --clobber }
      - name: Publish updater manifest
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m 'Updater: publish V1.22' || echo 'manifest unchanged'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V1.22
          path: dist/RelojLab.exe
          if-no-files-found: error
