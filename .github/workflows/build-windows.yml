name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V1.95 wrapper
        run: python -c "import ast; s=open('app_v173.py',encoding='utf-8').read(); ast.parse(s); assert 'app_v195' in s; t=open('app_v195.py',encoding='utf-8').read(); ast.parse(t); assert '1.95.0' in t; assert 'PREPARAR VINCULACIÓN EXACTA' in t; assert '_restore_location_button' in t; assert 'ota_writes' in t"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0 pillow numpy
      - name: Fetch donor asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force assets | Out-Null
          Invoke-WebRequest 'http://watchhealth.com.cn/k6File/clock/file/2D7F.bin' -OutFile assets/donor_2D7F.bin
      - run: python prepare_v133_dynamic.py
      - run: python -m unittest discover -s tests
      - run: python -m py_compile app.py app_v144.py app_v145.py app_v146.py app_v147.py app_v148.py app_v149.py app_v150.py app_v151.py app_v152.py app_v153.py app_v154.py app_v154_core.py app_v155.py app_v156.py app_v157.py app_v158.py app_v159.py app_v160.py app_v161.py app_v162.py app_v163.py app_v164.py app_v165.py app_v166.py app_v167.py app_v168.py app_v169.py app_v170.py app_v171.py app_v172.py app_v173.py app_v174.py app_v175.py app_v176.py app_v177.py app_v178.py app_v179.py app_v180.py app_v181.py app_v182.py app_v183.py app_v184.py app_v185.py app_v186.py app_v187.py app_v188.py app_v189.py app_v190.py app_v191.py app_v192.py app_v193.py app_v194.py app_v195.py connection.py windows_binding.py prepare_v133_dynamic.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab --add-data "assets/face_v133_custom_same_id.b64;assets" --add-data "assets/face_v133_custom_verified.b64;assets" --add-data "assets/face_v133_oem_recovery.b64;assets" --add-data "assets/face_v133.json;assets" app_v173.py
      - name: SHA256
        id: sha
        shell: pwsh
        run: |
          $hash=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          "sha256=$hash" >> $env:GITHUB_OUTPUT
          Write-Host $hash
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V1.95
          path: dist/RelojLab.exe
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.95.0
          name: Reloj Lab V1.95
          body: Prepara la identidad BLE exacta del reloj seleccionado para el paso de vinculacion. Sin acciones de red ni escrituras OTA.
          files: dist/RelojLab.exe
          make_latest: true
      - name: Advance updater manifest
        shell: pwsh
        run: |
          $obj = [ordered]@{
            exe_url = 'https://github.com/Yakoderaa/reloj/releases/download/v1.95.0/RelojLab.exe'
            sha256 = '${{ steps.sha.outputs.sha256 }}'
            notes = 'V1.95 prepara la identidad BLE exacta para la vinculacion y mantiene Buscar ubicacion.'
            version = '1.95.0'
          }
          $obj | ConvertTo-Json | Set-Content version.json -Encoding utf8
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git diff --cached --quiet; if ($LASTEXITCODE -ne 0) { git commit -m 'Advance updater manifest to V1.95'; git push }
