name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python build_patch_v029.py
      - run: python build_patch_v075.py
      - run: python build_patch_v080.py
      - run: python build_patch_v081.py
      - run: python build_patch_v082.py
      - run: python build_patch_v083.py
      - run: python build_patch_v084.py
      - run: python build_patch_v085.py
      - run: python build_patch_v086.py
      - run: python build_patch_v087.py
      - run: python build_patch_v088.py
      - run: python build_patch_v101.py
      - run: python build_patch_v102.py
      - run: python build_patch_v103.py
      - run: python build_patch_v104.py
      - run: python build_patch_v105.py
      - run: python build_patch_v106.py
      - run: python build_patch_v107.py
      - run: python build_patch_v108.py
      - run: python build_patch_v109.py
      - run: python build_patch_v110.py
      - run: python build_patch_v111.py
      - run: python build_patch_v112.py
      - run: python build_patch_v113.py
      - name: Verify V1.13
        run: python -c "import ast; t=ast.parse(open('app.py',encoding='utf-8').read()); v=next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)); assert v=='1.13.0',v"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - run: python -m py_compile app.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - name: Calculate EXE SHA256 and updater manifest
        shell: pwsh
        run: |
          $sha=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          $manifest=@{
            version='1.13.0'
            exe_url='https://github.com/Yakoderaa/reloj/releases/download/v1.13.0/RelojLab.exe'
            sha256=$sha
            notes='V1.13: recuperación post-reset persistente; nueva instancia WinRT/Bleak espera estabilización GATT.'
          } | ConvertTo-Json
          Set-Content -Path version.json -Value $manifest -Encoding UTF8
      - name: Publish V1.13 release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.13.0 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v1.13.0 dist/RelojLab.exe --title 'Reloj Lab V1.13' --notes 'V1.13: recuperación post-reset persistente; nueva instancia WinRT/Bleak espera estabilización GATT.' }
          else { gh release upload v1.13.0 dist/RelojLab.exe --clobber }
      - name: Publish updater manifest
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m 'Updater: publish V1.13' || echo 'manifest unchanged'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V1.13
          path: dist/RelojLab.exe
          if-no-files-found: error
