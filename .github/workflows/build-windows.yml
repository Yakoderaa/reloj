name: Build Windows EXE
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt pyinstaller==6.22.3
      - run: pyinstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows
          path: dist/RelojLab.exe
