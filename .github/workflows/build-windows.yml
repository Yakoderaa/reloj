name: Build Windows EXE
on:
  push:
    branches: [main]
    paths-ignore: [version.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify V1.17
        run: python -c "import ast; t=ast.parse(open('app.py',encoding='utf-8').read()); v=next(n.value.value for n in t.body if isinstance(n,ast.Assign) and any(isinstance(x,ast.Name) and x.id=='APP_VERSION' for x in n.targets)); assert v=='1.17.0',v"
      - run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - run: python -m unittest discover -s tests
      - run: python -m py_compile app.py connection.py
      - run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - name: Calculate EXE SHA256 and updater manifest
        shell: pwsh
        run: |
          $sha=(Get-FileHash dist/RelojLab.exe -Algorithm SHA256).Hash.ToLower()
          $manifest=@{
            version='1.17.0'
            exe_url='https://github.com/Yakoderaa/reloj/releases/download/v1.17.0/RelojLab.exe'
            sha256=$sha
            notes='V1.17: consulta GATT directa al servicio E91A durante la instalación; conserva validación ATT y agrega registro nativo por intento. Conexión física pendiente de verificar.'
          } | ConvertTo-Json
          Set-Content -Path version.json -Value $manifest -Encoding UTF8
      - name: Publish V1.17 release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.17.0 *> $null
          if ($LASTEXITCODE -ne 0) { gh release create v1.17.0 dist/RelojLab.exe --title 'Reloj Lab V1.17' --notes 'V1.17: consulta GATT directa al servicio E91A durante la instalación; conserva validación ATT y agrega registro nativo por intento. Conexión física pendiente de verificar.' }
          else { gh release upload v1.17.0 dist/RelojLab.exe --clobber }
      - name: Publish updater manifest
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add version.json
          git commit -m 'Updater: publish V1.17' || echo 'manifest unchanged'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows-V1.17
          path: dist/RelojLab.exe
          if-no-files-found: error
