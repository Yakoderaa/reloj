name: Build Windows EXE
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RelojLab app.py
      - uses: actions/upload-artifact@v4
        with:
          name: RelojLab-Windows
          path: dist/RelojLab.exe
          if-no-files-found: error
      - name: Publish latest EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest dist/RelojLab.exe --clobber
          } else {
            gh release create latest dist/RelojLab.exe --title "Reloj Lab Latest" --notes "Canal automático de actualización de Reloj Lab."
          }
